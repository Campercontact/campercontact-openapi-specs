<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Partner API - Campercontact</title>
    <meta name="description" content="API reference for the Campercontact Partners API" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://campercontact-partner-docs-8cc8c74cb5a5.herokuapp.com/" />
    <meta property="og:title" content="Partner API - Campercontact" />
    <meta property="og:description" content="API reference for the Campercontact Partners API" />
    <!-- Crawlers need an absolute URL here -->
    <meta property="og:image" content="https://campercontact-partner-docs-8cc8c74cb5a5.herokuapp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>

    <!-- Pinned so a Scalar release can never change the docs without a commit -->
    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.1"></script>
    <script>
      Scalar.createApiReference('#app', {
        url: './documentation.yaml',
        // Read-only for now: the partner API does not allow CORS from the docs domain yet
        hideTestRequestButton: true,
        hideClientButton: true,
        showDeveloperTools: 'never',
        agent: { disabled: true },
        mcp: { disabled: true },
        telemetry: false,
        favicon: './favicon.svg',
        // Light mode gets the brand colours; full green fails text contrast (3.6:1), so
        // links and highlights use dark green. Dark mode is Scalar's default theme.
        customCss: `
          .light-mode {
            --scalar-font: 'Radio Canada Big', sans-serif;
            --scalar-color-1: #1a4948;
            --scalar-color-2: #3c5f5e;
            --scalar-color-3: #5f7b7a;
            --scalar-color-accent: #1a4948;
            --scalar-background-1: #ffffff;
            --scalar-background-2: #f1f8f2;
            --scalar-background-3: #e4f0e6;
            --scalar-background-accent: #f1f8f2;
            --scalar-border-color: #dde9df;
            --scalar-sidebar-background-1: #f1f8f2;
            --scalar-sidebar-item-active-background: #e4f0e6;
            --scalar-sidebar-color-active: #1a4948;
            --scalar-sidebar-search-background: #ffffff;
          }
          .t-doc__sidebar::before {
            content: '';
            display: block;
            height: 44px;
            margin: 20px 12px 8px;
            background: url('./logo.svg') left center / contain no-repeat;
          }
          .dark-mode .t-doc__sidebar::before {
            background-image: url('./logo-white.svg');
          }
        `,
      })
    </script>
  </body>
</html>
