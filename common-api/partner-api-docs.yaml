openapi: 3.0.3
info:
  title: Campercontact Partners API
  description: |
    API for Campercontact partners to access location data
    
    ## Authentication
    This API requires authentication using an API key. Include your API key in the `x-api-key` header with every request.
    
    To obtain an API key, contact Campercontact at developer@campercontact.com.
    
    ### Example
    ```
    x-api-key: your-api-key-here
    ```
  version: 1.0.0
  contact:
    name: Campercontact API Support
    email: developer@campercontact.com

security:
  - ApiKeyAuth: []

paths:
  /locations:
    post:
      summary: Create a partner-owned location (supply partners only)
      description: >
        Creates a location owned by the calling supply partner (PD-248). The location is accepted
        and stored immediately; the Travelbase listing provisions asynchronously, so the location
        starts non-bookable. Photos travel as partner-hosted URLs in `media` — send them from day
        one so payloads never change, but they are not processed yet: photo ingest ships as a
        follow-up. Requires the supply capability. Rental units are not yet part of this
        contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerCreateLocationRequest'
      responses:
        '201':
          description: Location accepted and stored (not yet bookable)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerCreateLocationResponse'
        '400':
          description: Invalid payload (missing required fields, unknown enum codes, duplicate name within 500 m)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The partner already has a location under this externalId — update it via PUT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get basic location information
      description: Retrieve basic information about locations, optionally filtered by specific sitecodes
      operationId: getLocations
      tags:
        - Locations
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: sitecodes
          in: query
          required: false
          description: Optional comma-separated list of location sitecodes to filter results
          schema:
            type: string
            example: "12345,67890,11111"
        - name: limit
          in: query
          required: false
          description: Number of results to return per page (default 10, max 100)
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
            example: 25
        - name: offset
          in: query
          required: false
          description: Number of results to skip for pagination
          schema:
            type: integer
            minimum: 0
            default: 0
            example: 50
      responses:
        '200':
          description: Locations retrieved successfully
          headers:
            X-Request-ID:
              description: Unique identifier for this request
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLocationsResponse'
              example:
                data:
                  - siteCode: "12345"
                    name: "Camperpark De Zandstuve"
                  - siteCode: "67890"
                    name: "Camping Le Soleil"
                pagination:
                  limit: 10
                  offset: 0
                  total: 250
        '400':
          description: Bad Request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # One path item for both operations: OpenAPI treats /locations/{externalId} and
  # /locations/{sitecode} as the same templated path. The placeholder keeps the name the read
  # clients were generated with; for PUT its value is the partner's externalId.
  /locations/{sitecode}:
    put:
      summary: Full-resource update of a partner-owned location (supply partners only)
      description: >
        Overwrites the payload-derived fields of the partner's location addressed by its own
        externalId (the {sitecode} path parameter) — the partner is the source of truth for its
        inventory, so moderator edits to the fields it sends do not stick. An absent address field
        is cleared; an absent contact or limits field keeps its stored value. The media URL list is accepted
        but not processed yet (photo ingest ships as a follow-up). Deactivation travels as
        isActive=false; there is no DELETE. Another partner's externalId behaves as absent (404),
        so existence cannot be probed.
      parameters:
        - name: sitecode
          in: path
          required: true
          description: >
            For this operation the value is the partner's own externalId for the location, not a
            sitecode; the placeholder shares its name with the GET on the same path. The path carries
            the identity on update; a body externalId is ignored.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PartnerUpdateLocationRequest'
      responses:
        '200':
          description: Location updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerUpdateLocationResponse'
        '400':
          description: Invalid payload (missing required fields, unknown enum codes, duplicate name within 500 m)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The partner has no location under this externalId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get basic location information
      description: Retrieve basic information about a specific location (sitecode and name only)
      operationId: getLocationBySitecode
      tags:
        - Locations
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: sitecode
          in: path
          required: true
          description: The location sitecode
          schema:
            type: string
            example: "12345"
      responses:
        '200':
          description: Basic location information retrieved successfully
          headers:
            X-Request-ID:
              description: Unique identifier for this request
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerLocationResponse'
              example:
                siteCode: "12345"
                name: "Camperpark De Zandstuve"
        '400':
          description: Bad Request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: "Missing location sitecode"
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - message: "No location found with the given sitecode"
                    code: 3001
                    details: "12345"
        '500':
          $ref: '#/components/responses/InternalServerError'

  /locations/availability:
    post:
      summary: Get realtime pricing and availability for multiple locations
      description: Calculate and retrieve real-time pricing information and availability for multiple locations based on provided parameters such as dates, duration, and number of guests. This endpoint performs dynamic pricing calculations and returns personalized pricing details for each requested location.
      operationId: getMultipleLocationsAvailability
      tags:
        - Locations
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        description: Parameters for pricing calculation including the list of locations to check
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MultipleLocationsDetailsRequest'
      responses:
        '200':
          description: Multiple locations pricing and availability details retrieved successfully
          headers:
            X-Request-ID:
              description: Unique identifier for this request
              schema:
                type: string
                format: uuid
            X-RateLimit-Limit:
              description: Request limit per hour
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Time when rate limit resets (Unix timestamp)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MultipleLocationsPricingResponse'
              examples:
                with-availability:
                  summary: Multiple locations with availability
                  value:
                    locations:
                      - sitecode: "12345"
                        isBookable: true
                        isOpen: true
                        totalSpots: 30
                        totalAvailableSpots: 30
                        pitches:
                          - name: "basic pitch"
                            currency: "EUR"
                            pricePerNight: 25.50
                            totalPrice: 76.50
                            touristTaxPrice: 2.50
                            availableSpots: 30
                      - sitecode: "67890"
                        isBookable: false
                        isOpen: true
                        totalSpots: 15
                        totalAvailableSpots: 15
                        pitches:
                          - name: "basic pitch"
                            currency: "EUR"
                            pricePerNight: 22.00
                            totalPrice: 66.00
                            touristTaxPrice: 1.50
                            availableSpots: 15
                mixed-availability:
                  summary: Mixed availability - some locations available, others not
                  value:
                    locations:
                      - sitecode: "12345"
                        isBookable: true
                        isOpen: true
                        totalSpots: 30
                        totalAvailableSpots: 30
                        pitches:
                          - name: "basic pitch"
                            currency: "EUR"
                            pricePerNight: 25.50
                            totalPrice: 76.50
                            touristTaxPrice: 2.50
                            availableSpots: 30
                      - sitecode: "67890"
                        isBookable: false
                        isOpen: false
                        totalSpots: 15
                        totalAvailableSpots: null
                        pitches: null
        '400':
          description: Bad Request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /locations/{sitecode}/availability:
    post:
      summary: Get realtime location pricing and availability
      description: Calculate and retrieve real-time pricing information and availability for a specific location based on provided parameters such as dates, duration, and number of guests. This endpoint performs dynamic pricing calculations and returns personalized pricing details.
      operationId: getLocationAvailability
      tags:
        - Locations
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
        - name: sitecode
          in: path
          required: true
          description: The unique identifier of the location
          schema:
            type: string
            example: "12345"
      requestBody:
        required: false
        description: Optional parameters for pricing calculation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationDetailsRequest'
      responses:
        '200':
          description: Location pricing and availability details retrieved successfully
          headers:
            X-Request-ID:
              description: Unique identifier for this request
              schema:
                type: string
                format: uuid
            X-RateLimit-Limit:
              description: Request limit per hour
              schema:
                type: integer
            X-RateLimit-Remaining:
              description: Requests remaining in current window
              schema:
                type: integer
            X-RateLimit-Reset:
              description: Time when rate limit resets (Unix timestamp)
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocationPricingResponse'
              examples:
                with-availability:
                  summary: Location with available spots and pricing
                  value:
                    sitecode: "12345"
                    isBookable: true
                    isOpen: true
                    totalSpots: 50
                    totalAvailableSpots: 50
                    pitches:
                      - name: "basic pitch"
                        currency: "EUR"
                        pricePerNight: 25.50
                        totalPrice: 76.50
                        touristTaxPrice: 2.50
                        availableSpots: 30
                      - name: "pitch with electricity"
                        currency: "EUR"
                        pricePerNight: 30.00
                        totalPrice: 90.00
                        touristTaxPrice: 2.50
                        availableSpots: 20
                no-availability:
                  summary: Location with no available spots
                  value:
                    sitecode: "12345"
                    isBookable: false
                    isOpen: false
                    totalSpots: 15
                    totalAvailableSpots: null
                    pitches: null
        '400':
          description: Bad Request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too Many Requests - Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /locations/{sitecode}/photos:
    post:
      summary: Insert a photo into a location
      description: |
        Downloads the image at the given https `url` and inserts it into the location's photo list at
        the requested `order`, shifting existing photos at or after that position up by one. The image
        is fetched server-side, stored, and linked to the location.
      operationId: insertLocationPhoto
      tags:
        - Locations
      parameters:
        - name: sitecode
          in: path
          required: true
          description: The unique identifier of the location
          schema:
            type: string
            example: "12345"
      requestBody:
        required: true
        description: The image url to fetch and, optionally, the partner source it comes from
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InsertLocationPhotoRequest'
      responses:
        '201':
          description: Photo appended successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaResponse'
              example:
                id: "b3f1c2de-4a5b-6c7d-8e9f-0a1b2c3d4e5f"
                order: 0
                displayType: "user_generated"
                type: "photo"
                videoType: null
                url: "https://images.campercontact.com/photos/location/…/b3f1c2de.jpeg"
                createdAt: "2026-09-15T10:30:00Z"
        '400':
          description: Bad Request - invalid url/sourceType, download failure, unsupported type, or oversize image
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden - request did not come through the Partner API Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Location not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                errors:
                  - message: "No location found with the given sitecode"
                    code: 3001
                    details: "12345"
        '409':
          description: A photo from this url has already been added to the location
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
      description: API key for authentication at the API Gateway. Contact Campercontact to obtain your API key.
    GatewaySecret:
      type: apiKey
      in: header
      name: X-Partner-Api-Gateway-Secret
      description: >
        Injected by the Campercontact API Gateway on every forwarded request; the application rejects
        requests without it. Partners authenticate with their x-api-key at the gateway and never send
        this header themselves.

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Language preference for localized responses (e.g., location descriptions)
      schema:
        type: string
        enum: ["nl", "en", "de", "fr", "it"]
        default: "en"
        example: "en"
  schemas:
    PartnerLocationRequest:
      type: object
      description: The location payload shared by the create and update bodies.
      required: [name, description, type, location, address, currency]
      properties:
        name:
          type: string
        description:
          type: string
          description: One string; the backend auto-translates it into all supported languages.
        type:
          type: string
          enum: [camperplace, camping, serviceplace, microcamping, parking]
        location:
          $ref: '#/components/schemas/PartnerGeoPointRequest'
        address:
          $ref: '#/components/schemas/PartnerAddressRequest'
        contact:
          allOf:
            - $ref: '#/components/schemas/PartnerContactRequest'
          nullable: true
        currency:
          type: string
          description: ISO 4217 code
        pricePeriods:
          type: array
          items:
            $ref: '#/components/schemas/PartnerPricePeriodRequest'
        amenities:
          type: array
          description: AmenityType codes, not free-form strings.
          items:
            $ref: '#/components/schemas/PartnerAmenityRequest'
        surroundings:
          type: array
          items: { type: string }
          description: SurroundingType codes.
        terrains:
          type: array
          items: { type: string }
          description: TerrainType codes.
        limits:
          allOf:
            - $ref: '#/components/schemas/PartnerLimitsRequest'
          nullable: true
        discountCards:
          type: array
          items: { type: string }
        media:
          type: array
          maxItems: 20
          description: >
            The location's photos as partner-hosted absolute https URLs (max 20). All images —
            including per-rental-unit photos — belong in this one list. Accepted but not processed
            yet: send it from day one so payloads never change; the ingest step (photos stored as
            location images) ships as a follow-up.
          items:
            $ref: '#/components/schemas/PartnerMediaItemRequest'
        isActive:
          type: boolean
          default: true
          description: Deactivation travels on PUT — there is no DELETE for locations.
    PartnerCreateLocationRequest:
      allOf:
        - $ref: '#/components/schemas/PartnerLocationRequest'
        - type: object
          required: [externalId]
          properties:
            externalId:
              type: string
              maxLength: 100
              description: The partner's own permanent id for this location; the idempotency key of the create.
    PartnerUpdateLocationRequest:
      allOf:
        - $ref: '#/components/schemas/PartnerLocationRequest'
      description: The path carries the identity, so the body has no externalId.
    PartnerGeoPointRequest:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number }
        longitude: { type: number }
    PartnerAddressRequest:
      type: object
      description: >
        Street and postal code are optional; a place name plus coordinates is enough. The displayed
        city and country are reverse-geocoded from the coordinates; city and countryCode are stored
        as the fallback for when geocoding returns nothing.
      properties:
        street: { type: string, nullable: true }
        number: { type: string, nullable: true }
        postalCode: { type: string, nullable: true }
        city: { type: string, nullable: true }
        countryCode: { type: string, nullable: true, description: ISO 3166-1 alpha-2 }
    PartnerContactRequest:
      type: object
      properties:
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
    PartnerPricePeriodRequest:
      type: object
      required: [from, to, perNight]
      properties:
        from: { $ref: '#/components/schemas/DayOfYear' }
        to: { $ref: '#/components/schemas/DayOfYear' }
        perNight: { type: number, description: Rate per night in major units of the currency (38.50). }
        touristTax: { type: number, default: 0, description: Per night, in the same unit as perNight. }
    PartnerAmenityRequest:
      type: object
      required: [type]
      properties:
        type: { type: string }
        priceStatus: { type: string, nullable: true, enum: [unpaid, paid, unknown] }
        ampere: { type: integer, nullable: true }
    PartnerLimitsRequest:
      type: object
      properties:
        maxCapacity: { type: integer, nullable: true }
        maxStayHours: { type: string, nullable: true }
        maxCamperLength: { type: string, nullable: true }
    PartnerMediaItemRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, maxLength: 2048 }
        order:
          type: integer
          nullable: true
          description: Gallery position (lower first, unordered items last).
    DayOfYear:
      type: object
      required: [month, day]
      properties:
        month: { type: integer, minimum: 1, maximum: 12 }
        day: { type: integer, minimum: 1, maximum: 31 }
    PartnerCreateLocationResponse:
      type: object
      required: [sitecode, externalId, isBookable]
      properties:
        sitecode:
          type: string
          description: Server-generated; never client-supplied.
        externalId:
          type: string
        isBookable:
          type: boolean
          description: Always false until Travelbase provisioning ships; poll the read endpoint.
    PartnerUpdateLocationResponse:
      type: object
      required: [sitecode, externalId, isBookable]
      properties:
        sitecode:
          type: string
        externalId:
          type: string
        isBookable:
          type: boolean
          description: Always false until Travelbase provisioning ships; poll the read endpoint.
    PaginatedLocationsResponse:
      type: object
      required:
        - data
        - pagination
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PartnerLocationResponse'
          description: Array of location data
        pagination:
          $ref: '#/components/schemas/PaginationInfo'

    PaginationInfo:
      type: object
      required:
        - limit
        - offset
        - total
      properties:
        limit:
          type: integer
          description: Number of results per page
          example: 10
        offset:
          type: integer
          description: Number of results skipped
          example: 0
        total:
          type: integer
          description: Total number of results available
          example: 250

    PartnerLocationResponse:
      type: object
      required:
        - siteCode
        - name
      properties:
        siteCode:
          type: string
          description: Unique sitecode identifier
          example: "12345"
        name:
          type: string
          description: Name of the location
          example: "Camperpark De Zandstuve"

    Error:
      type: object
      required:
        - message
        - timestamp
      properties:
        message:
          type: string
          description: Error message
          example: "Location not found"
        code:
          type: number
          description: Error code
          example: 1
        timestamp:
          type: string
          format: date-time
          description: Timestamp when the error occurred
          example: "2024-10-29T10:30:00Z"

    ErrorResponse:
      type: object
      required:
        - errors
      properties:
        errors:
          type: array
          description: One or more errors describing what went wrong
          items:
            type: object
            required:
              - message
              - code
            properties:
              message:
                type: string
                description: Human-readable description of the error
                example: "No location found with the given sitecode"
              code:
                type: integer
                description: Stable machine-readable error code
                example: 3001
              details:
                type: string
                nullable: true
                description: Optional context about the error (e.g. the offending value)
                example: "12345"

    ValidationError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            validationErrors:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string

    MultipleLocationsDetailsRequest:
      type: object
      required:
        - sitecodes
      properties:
        sitecodes:
          type: array
          items:
            type: string
          description: List of location sitecodes to check availability for
          example: ["12345", "67890", "11111"]
        date:
          type: string
          format: date
          nullable: true
          description: Date for pricing calculation (must be in UTC format)
          example: "2024-06-15"
        duration:
          type: integer
          minimum: 1
          nullable: true
          description: Duration of stay in nights for pricing calculation
          example: 3
        adults:
          type: integer
          minimum: 1
          nullable: true
          description: Number of adults for pricing calculation
          example: 2
        children:
          type: integer
          minimum: 0
          nullable: true
          description: Number of children for pricing calculation
          example: 1

    MultipleLocationsPricingResponse:
      type: object
      required:
        - locations
      properties:
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationPricingResponse'
          description: Array of location availability and pricing information

    LocationDetailsRequest:
      type: object
      properties:
        date:
          type: string
          format: date
          nullable: true
          description: Date for pricing calculation (must be in UTC format)
          example: "2024-06-15"
        duration:
          type: integer
          minimum: 1
          nullable: true
          description: Duration of stay in nights for pricing calculation
          example: 3
        adults:
          type: integer
          minimum: 1
          nullable: true
          description: Number of adults for pricing calculation
          example: 2
        children:
          type: integer
          minimum: 0
          nullable: true
          description: Number of children for pricing calculation
          example: 1

    LocationPricingResponse:
      type: object
      required:
        - sitecode
        - isBookable
      properties:
        sitecode:
          type: string
          description: Unique identifier of the location
          example: "12345"
        isBookable:
          type: boolean
          description: Whether the location supports real-time booking via TravelBase
          example: true
        isOpen:
          type: boolean
          nullable: true
          description: |
            Whether the location is open on the requested date (or today if no date provided),
            based on the location's price/opening periods stored in the database.
            Null if the location has no opening period data.
          example: true
        totalSpots:
          type: integer
          nullable: true
          description: Total maximum capacity of the location as stored in the database
          example: 30
          minimum: 0
        totalAvailableSpots:
          type: integer
          nullable: true
          description: Sum of available spots across all pitch types in this response. Null when no pitch data is available.
          example: 30
          minimum: 0
        pitches:
          type: array
          items:
            $ref: '#/components/schemas/PitchPrice'
          nullable: true
          description: Array of available pitch types and their pricing. If null, the location is closed or has no available spots.

    InsertLocationPhotoRequest:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          description: Public https url of the image to fetch and append
          example: "https://panoramax.example.org/photo/abc.jpg"
        sourceType:
          type: string
          nullable: true
          enum: ["qenner", "folder_import", "open_arial", "panoramax", "campio"]
          description: >
            Optional partner source the image comes from. When provided it must be one of the known
            sources (case-insensitive) or the request is rejected. Stored as media provenance.
          example: "panoramax"
        attribution:
          type: string
          nullable: true
          description: >
            Optional, free-form credit text for the photo (e.g. photographer or source line). Not
            validated. Stored alongside the source in the media metadata.
          example: "© Jane Doe / Panoramax"
        order:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: >
            Optional 0-based position to insert the photo at within the location's photo list. Existing
            photos at or after this position shift up by one. Defaults to 0 (inserted first) when omitted;
            a value beyond the end appends the photo last.
          example: 0
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: >
            Optional creation timestamp of the photo (ISO-8601). When supplied it is stored as the media's
            creation date instead of the time of upload; when omitted or null the upload time is used.
          example: "2024-05-01T10:00:00Z"

    MediaResponse:
      type: object
      required:
        - id
        - order
        - displayType
        - type
        - url
      properties:
        id:
          type: string
          format: uuid
          description: Unique identifier of the created media item
          example: "b3f1c2de-4a5b-6c7d-8e9f-0a1b2c3d4e5f"
        order:
          type: integer
          description: Ordering position within the location's photo list
          example: 0
        displayType:
          type: string
          description: How the media is displayed
          example: "user_generated"
        type:
          type: string
          description: Media type
          example: "photo"
        videoType:
          type: string
          nullable: true
          description: Video sub-type when the media is a video, otherwise null
          example: null
        url:
          type: string
          format: uri
          description: Public url of the stored media
          example: "https://images.campercontact.com/photos/location/…/b3f1c2de.jpeg"
        createdAt:
          type: string
          format: date-time
          nullable: true
          description: When the media was created
          example: "2026-09-15T10:30:00Z"

    PitchPrice:
      type: object
      properties:
        name:
          type: string
          description: Name/description of the pitch type (e.g., "pitch with electricity", "basic pitch", "pitch near water")
          example: "pitch with electricity"
        currency:
          type: string
          description: Currency code
          example: "EUR"
          default: "EUR"
        pricePerNight:
          type: number
          format: double
          nullable: true
          description: Price per night for this pitch type
          example: 25.50
          minimum: 0
        totalPrice:
          type: number
          format: double
          nullable: true
          description: Total price for the stay for this pitch type
          example: 127.50
          minimum: 0
        touristTaxPrice:
          type: number
          format: double
          nullable: true
          description: Tourist tax price
          example: 2.50
          minimum: 0
        availableSpots:
          type: integer
          description: Number of spots available for this pitch type
          example: 25
          minimum: 0

  responses:
    UnauthorizedError:
      description: Unauthorized - Invalid or missing API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Unauthorized - Invalid or missing API key"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "Internal server error"
